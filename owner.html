<title>Dr. Sudhir Kumar Rathour | Sewa Sagar Foundation</title>
<meta name="description" content="Meet Dr. Sudhir Kumar Rathour, manager of Sewa Sagar Foundation, supporting community health initiatives and health camps in Lakhimpur Kheri, Uttar Pradesh.">
<style>
:root{--blue:#0759a6;--navy:#092d57;--cyan:#08a9d6;--green:#078a4b;--gold:#f7c948;--ink:#17324d;--muted:#5e7185;--bg:#f4f8fc}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65}
header{background:linear-gradient(120deg,#062b56,#0877b8 65%,#09afd1);color:white;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.3px}.brand small{display:block;font-weight:500;font-size:.8rem;opacity:.9}
nav{display:flex;gap:16px;flex-wrap:wrap}nav a{color:white;text-decoration:none;font-weight:700;font-size:.93rem}nav a:hover{text-decoration:underline}
.hero{padding:55px 5%;background:linear-gradient(135deg,#e2f7ff,#fff 60%,#e7fff2)}.hero-inner{max-width:1100px;margin:auto;display:grid;grid-template-columns:300px 1fr;gap:38px;align-items:center}
.portrait{width:100%;max-width:300px;aspect-ratio:4/5;object-fit:cover;object-position:center top;border-radius:24px;border:6px solid white;box-shadow:0 14px 40px #153b5a24}
.kicker{color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;font-size:.82rem}
h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.12;margin:8px 0 14px;color:var(--navy)}.hero p{font-size:1.08rem;color:#405c75;max-width:680px}
.badge{display:inline-block;background:#dff7e9;color:#087542;border:1px solid #b8ebce;border-radius:999px;padding:6px 13px;font-size:.86rem;font-weight:700;margin:6px 0 14px}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.btn{display:inline-block;padding:11px 17px;border-radius:10px;text-decoration:none;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:white;color:var(--blue);border:1px solid #b7d6ef}
.wrap{max-width:1100px;margin:auto;padding:38px 5%}.section-title{font-size:clamp(1.5rem,3vw,2.2rem);color:var(--navy);margin:0 0 8px}.intro{color:var(--muted);margin:0 0 24px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #e1ebf4;border-radius:16px;padding:22px;box-shadow:0 7px 22px #163b5b08}.card h3{margin:0 0 8px;color:var(--blue)}.card p{margin:0;color:var(--muted)}
.owner-details{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail{padding:15px;background:white;border:1px solid #e1ebf4;border-radius:12px}.detail strong{display:block;color:var(--navy);font-size:.82rem;text-transform:uppercase;letter-spacing:.6px}.detail span{overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.gallery figure{margin:0;background:white;border-radius:14px;overflow:hidden;border:1px solid #e1ebf4;box-shadow:0 6px 20px #163b5b0a}.gallery img{display:block;width:100%;height:230px;object-fit:cover}.gallery figcaption{padding:12px 14px;font-weight:700;color:var(--navy)}
.contact{background:linear-gradient(120deg,#082e59,#075da5);color:white;border-radius:20px;padding:28px}.contact h2{margin-top:0}.contact a{color:#fff}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.contact p{margin:7px 0}
footer{text-align:center;padding:25px 5%;background:#061f3d;color:#d7e9f8;font-size:.9rem}
@media(max-width:760px){.hero-inner{grid-template-columns:1fr;text-align:center}.portrait{margin:auto;max-width:230px}.buttons{justify-content:center}.cards,.gallery{grid-template-columns:1fr 1fr}.owner-details{grid-template-columns:1fr}.gallery img{height:180px}.contact-grid{grid-template-columns:1fr}}
@media(max-width:470px){.cards,.gallery{grid-template-columns:1fr}.gallery img{height:auto;max-height:320px}header{justify-content:center;text-align:center}nav{justify-content:center}}
</style>
</head>
